			);
			name = "Touch forth.s if .incbin sources newer";
			shellPath = /bin/sh;
			shellScript = (
				"set -e",
				"KERN=\"${SRCROOT}/Forth/Kernel\"",
				"ASM=\"${KERN}/forth.s\"",
				"need=0",
				"for f in kernel1.fth kernel2.fth vocemit.fth vocsys.fth app-output.fth app-points.fth xref.fth boot_words.inc boot_words_end.inc colon_words.inc; do",
				"  if [ -f \"${KERN}/$f\" ] && [ \"${KERN}/$f\" -nt \"$ASM\" ]; then need=1; break; fi",
				"done",
				"if [ \"$need\" = 1 ]; then",
				"  touch \"$ASM\"",
				"  echo \"note: touched forth.s (embedded .fth/.inc newer)\"",
				"fi",
				"",
